# Runs next to the existing containers on the VPS. Bound to localhost only;
# expose it through the reverse proxy (Caddy/nginx) that already terminates TLS on the box.
services:
  phishing-analyser:
    image: ghcr.io/${GHCR_OWNER:-salem501jo}/phishing-analyser:${TAG:-latest}
    build: .
    container_name: phishing-analyser
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"   # API, for the reverse proxy
      - "127.0.0.1:9464:9464"   # Prometheus metrics, host-local only (never proxied)
    environment:
      # Per-install API keys: generate with
      #   docker run --rm ghcr.io/salem501jo/phishing-analyser --new-api-key <name>
      # and put the two printed API_CLIENT_N_* lines in a .env file next to this one. The API refuses to start in
      # production without at least one key (set ALLOW_ANONYMOUS=true in .env to run it open on purpose).
      - ApiClients__0__Name=${API_CLIENT_0_NAME:-}
      - ApiClients__0__KeySha256=${API_CLIENT_0_SHA256:-}
      - ApiClients__1__Name=${API_CLIENT_1_NAME:-}
      - ApiClients__1__KeySha256=${API_CLIENT_1_SHA256:-}
      - ApiKey=${PHISHING_API_KEY:-}   # legacy single shared key, still accepted
      - AllowAnonymous=${ALLOW_ANONYMOUS:-false}
      - RateLimit__PerMinute=60
      # A host proxy reaches the container through the bridge gateway (below), not loopback. Only that address
      # may set X-Forwarded-For, so rate limits apply per real client. If the proxy is itself a container, attach it
      # to the "analyser" network, proxy to phishing-analyser:8080, and trust the subnet instead:
      #   ForwardedHeaders__KnownNetworks__0=172.30.57.0/24
      - ForwardedHeaders__KnownProxies__0=172.30.57.1
    networks:
      - analyser
    mem_limit: 640m   # transformer (136 MB int8) + linear explainer: ~470 MB steady, ~530 MB while loading
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - feedback-data:/app/data   # the only writable path: 👍/👎 feedback (SQLite)
    security_opt:
      - no-new-privileges:true
    # Health check comes from the image (Dockerfile HEALTHCHECK); `docker compose up --wait` waits for it.

networks:
  analyser:
    ipam:
      config:
        - subnet: 172.30.57.0/24   # fixed, so the gateway address above is predictable

volumes:
  feedback-data:

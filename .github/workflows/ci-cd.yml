name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (tags can be moved by whoever controls the action's repo);
# Dependabot keeps the pins up to date. The version is in the trailing comment.

jobs:
  test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Fetch model binaries (GitHub Release, checksum-verified)
        run: python3 scripts/models.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dotnet restore
      - name: Fail on known-vulnerable NuGet packages (incl. transitive)
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults

  extension:
    name: Lint & package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Syntax-check scripts and validate manifest
        run: |
          for f in extension/src/*.js extension/options.js; do node --check "$f"; done
          node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 required')"
      - name: Unit tests (Vitest + jsdom)
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Fail on known-vulnerable npm packages
        working-directory: extension
        run: npm audit --audit-level=high
      - name: Package (runtime files only - no tests, no node_modules)
        run: cd extension && zip -r ../phishing-analyser-extension.zip manifest.json options.html options.js src vendor icons -x '*.DS_Store'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension
          path: phishing-analyser-extension.zip

  image-scan:
    name: Image scan (Trivy) & SBOM
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload (public repos; code scanning isn't available on free private repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/models.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image locally (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: phishing-analyser:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image itself must start, load the model and fold look-alike text (NFKC) exactly as training did - in
      # invariant-globalization mode .NET silently skipped that, and nothing short of running the image would show it.
      - name: Smoke test - the image serves and normalises text like training
        run: |
          # Same restrictions as docker-compose.yml, so the read-only filesystem, memory limit and feedback volume are
          # exercised here and not for the first time on the server.
          docker run -d --name smoke --read-only --tmpfs /tmp --memory 640m --cpus 0.5 -v smoke-feedback:/app/data \
            -e AllowAnonymous=true -p 127.0.0.1:8080:8080 phishing-analyser:scan
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8080/health > health.json 2>/dev/null && break; sleep 2; done
          grep -q '"contentModelLoaded":true' health.json || { docker logs smoke; exit 1; }
          python3 - <<'EOF'
          import json, urllib.request
          def bold(t):
              return ''.join(chr(0x1D400 + ord(c) - 65) if 'A' <= c <= 'Z' else chr(0x1D41A + ord(c) - 97) if 'a' <= c <= 'z' else c for c in t)
          def content(f):
              email = {"subject": f("Verify your account"), "body": f("Your account will be suspended. Verify your password now."),
                       "senderEmail": "alerts@example-mail.net"}
              req = urllib.request.Request("http://127.0.0.1:8080/api/v1/analyse", json.dumps(email).encode(), {"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=30))["breakdown"]["content"]["probability"]
          plain, folded = content(lambda t: t), content(bold)
          print(f"phishing probability: plain {plain}, math-bold {folded}")
          assert plain > 0.5, "the model did not flag an obvious phishing text"
          assert folded == plain, "math-bold text was not folded to plain letters (invariant globalization?)"
          vote = urllib.request.Request("http://127.0.0.1:8080/api/v1/feedback",
              json.dumps({"correct": True, "verdict": "phishing", "score": 0.9}).encode(), {"Content-Type": "application/json"})
          assert urllib.request.urlopen(vote, timeout=30).status == 204, "feedback could not be written to the volume"
          EOF
          # Without keys and without AllowAnonymous the production image must refuse to start.
          if docker run --rm --read-only --tmpfs /tmp phishing-analyser:scan > closed.log 2>&1; then
            echo "the image started without API keys"; exit 1
          fi
          grep -q "No API keys are configured" closed.log
      - name: Trivy - fail on fixable HIGH/CRITICAL vulnerabilities, secrets or misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: phishing-analyser:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy - full report as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: phishing-analyser:scan
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true
      - name: SBOM (SPDX) of the image
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: phishing-analyser:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports
          path: |
            trivy.sarif
            sbom.spdx.json
      - name: Publish Trivy findings to GitHub code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

  image:
    name: Build & push Docker image
    needs: [test, image-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/models.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/phishing-analyser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true                 # SBOM + provenance attached to the image in the registry
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [image]
    # Opt-in: set repository variable DEPLOY_ENABLED=true once the VPS secrets below exist.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}   # optional: pins the server's SSH host key
          script: |
            set -e
            cd ${{ vars.VPS_APP_DIR || '~/phishing-analyser' }}
            # docker-compose.yml and .env (API keys) are placed on the server by hand - see the README.
            test -f docker-compose.yml || { echo "docker-compose.yml is missing in $(pwd)"; exit 1; }
            test -f .env || { echo ".env (API_CLIENT_0_NAME / API_CLIENT_0_SHA256) is missing in $(pwd)"; exit 1; }
            trap 'docker logout ghcr.io' EXIT   # don't leave the short-lived registry token on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export TAG=sha-$(echo "${{ github.sha }}" | cut -c1-7)   # exactly the image this run built, not "latest"
            # --no-build + --pull always: a failed pull fails the deploy instead of falling back to a local build or an
            # old image. --wait blocks until the container's HEALTHCHECK reports healthy.
            docker compose up -d --no-build --pull always --wait --wait-timeout 120 phishing-analyser
            docker image prune -f
            curl -fsS http://127.0.0.1:5080/health | grep -q '"contentModelLoaded":true'
            # The deployed API must reject a request without a key.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"subject":"x"}' http://127.0.0.1:5080/api/v1/analyse)
            [ "$code" = "401" ] || { echo "expected 401 without an API key, got $code"; exit 1; }
